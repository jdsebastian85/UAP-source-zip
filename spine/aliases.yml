# spine/aliases.yml — alias clusters for query-time search expansion (T3b.2)
#
# A cluster is a retrieval hint. It never licenses stating that two spellings
# are the same person. Site copy says "also matches" and never "same as".
# Nothing in this file is ever written back into a CSV.
#
# Every member carries a page cite (cites[i] belongs to members[i]).
# reviewed_by stays empty until a person has looked at the cited pages.
# confidence: unreviewed | confirmed | disputed
#
# This file is hand-maintained. Seeded 2026-08-08 from entities_normalized.csv;
# excluded lookalike candidates are noted per cluster so a reviewer can promote
# them deliberately rather than by script.

