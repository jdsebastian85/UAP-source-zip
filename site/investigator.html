<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PURSUE corpus — investigator</title>
<style>
:root{
  --bg:#f6f4f1; --panel:#fff; --panel-2:#efebe6; --line:#ddd6cd;
  --ink:#171412; --dim:#6b625a;
  --accent:#b4560d; --accent-ink:#fff; --accent-soft:#f7e7d8;
  --mark:#cfe3ea; --warn:#a8322a;
  /* Evidence-layer colour is rationed. Inside the transcript, the combs and the
     cites, ONE saturated hue appears and it means a page that could not be read.
     Everything else there is neutral. The chrome may use the accent freely; the
     evidence layer may not. */
  --comb-solid:#5f7f96;    /* machine: page has a text layer */
  --comb-hollow:#a9a096;   /* machine: below the 0.90 page-legibility proxy */
  --comb-unread:#c25e0a;   /* machine: NO text layer — the one saturated hue */
  --worked:#7a6b5d;        /* human: a reader has worked this page */
  --radius:10px; --pad:14px;
  --glass-bg:rgba(255,255,255,.72); --glass-blur:12px;
  --glass-hair:rgba(23,20,18,.07);
  --shadow-1:0 1px 2px rgba(23,20,18,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100e0c; --panel:#191613; --panel-2:#221e1a; --line:#332c26;
    --ink:#efeae4; --dim:#9a9086;
    --accent:#f57c1f; --accent-ink:#1a0f05; --accent-soft:#2e1c0d;
    --mark:#2b3f49; --warn:#e8695f;
    --comb-solid:#7f96a8; --comb-hollow:#4a423a; --comb-unread:#f57c1f;
    --worked:#c8bdb2;
    --glass-bg:rgba(25,22,19,.66); --glass-hair:rgba(255,255,255,.07);
    --shadow-1:0 1px 2px rgba(0,0,0,.40);
  }
}
:root[data-theme="dark"]{
--bg:#100e0c; --panel:#191613; --panel-2:#221e1a; --line:#332c26;
  --ink:#efeae4; --dim:#9a9086;
  --accent:#f57c1f; --accent-ink:#1a0f05; --accent-soft:#2e1c0d;
  --mark:#2b3f49; --warn:#e8695f;
  --comb-solid:#7f96a8; --comb-hollow:#4a423a; --comb-unread:#f57c1f;
  --worked:#c8bdb2;
  --glass-bg:rgba(25,22,19,.66); --glass-hair:rgba(255,255,255,.07);
  --shadow-1:0 1px 2px rgba(0,0,0,.40);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
a{color:var(--accent)}
/* Chrome carries the depth. The evidence layer below never does. */
header{
  position:sticky; top:0; z-index:20;
  background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-hair), var(--shadow-1);
  padding:8px var(--pad) 0;
  padding-top:calc(8px + env(safe-area-inset-top));
}
@supports not (backdrop-filter:blur(2px)){ header{background:var(--bg)} }
.hrow{display:flex; gap:8px; align-items:center}
.hrow h1{font-size:15px; margin:0 auto 0 0; font-weight:650; letter-spacing:.2px}
.hrow .sub{font-size:11px; color:var(--dim); font-weight:400}
input[type=search],input[type=text],textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px;
}
input[type=search]{margin:8px 0}
textarea{min-height:76px; resize:vertical; line-height:1.45}
nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto; font:inherit; font-size:13px; background:none; color:var(--dim);
  border:none; border-bottom:2px solid transparent; padding:9px 11px; cursor:pointer;
}
nav button[aria-selected=true]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
main{padding:var(--pad); padding-bottom:calc(48px + env(safe-area-inset-bottom)); max-width:900px; margin:0 auto}
main.wide{max-width:1280px}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:11px 12px; margin-bottom:9px; box-shadow:var(--shadow-1);
}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--accent-soft)}
.t{font-weight:600; font-size:14.5px; word-break:break-word}
.m{font-size:12px; color:var(--dim); margin-top:3px; word-break:break-word}
.m b{color:var(--ink); font-weight:600}
.pill{
  display:inline-block; font-size:10.5px; padding:1.5px 6px; border-radius:99px;
  border:1px solid var(--line); color:var(--dim); margin-right:4px; white-space:nowrap;
}
.pill.on{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
.pill.warn{color:var(--warn); border-color:var(--warn)}
.rowbtns{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
button.act{
  font:inherit; font-size:13px; background:var(--panel); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:7px 11px; cursor:pointer;
}
button.act.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
button.act:active{opacity:.7}
.star{
  font:inherit; font-size:17px; line-height:1; background:none; border:none; cursor:pointer;
  color:var(--dim); padding:2px 4px;
}
.star.on{color:var(--accent)}
/* Human coverage. One tick per page, filled where a reader has said they
   worked it. This is the human half of the comb: when T10 lands, its
   machine-readability comb sits directly above this one and the disagreement
   between the two rows — pages a machine can read that no human has looked at
   — is the thing worth looking at. */
/* Row gap is wide enough for each tick to carry a hit area taller than it
   looks. The visual tick stays small because a 211-page release has to fit;
   the touchable square does not have to be the same size as the mark. Final
   sizing lands in Wave 2, when the machine row stacks above this one. */
.comb{display:flex; flex-wrap:wrap; gap:9px 3px; margin-top:8px}
.comb button{
  position:relative; width:11px; height:17px; padding:0; cursor:pointer;
  border-radius:2px; border:1px solid var(--comb-hollow); background:none;
}
.comb button::after{content:""; position:absolute; inset:-4px -3px}
/* Human coverage is a neutral, deliberately NOT the accent: inside the evidence
   layer the accent hue is reserved for a page that could not be read. */
.comb button.worked{background:var(--worked); border-color:transparent}
.comb button.starred{box-shadow:inset 0 0 0 2px var(--ink)}
.wbtn{
  background:none; border:1px solid var(--line); border-radius:8px; font:inherit;
  font-size:12px; color:var(--dim); padding:5px 9px; cursor:pointer; white-space:nowrap;
}
.wbtn.on{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
.covbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:2px 0 10px}
/* T10 co-presence. Evidence layer: flat, opaque, never glass. The only
   saturated colour in here is --comb-unread, and it means one thing. */
.mcomb{display:flex; flex-wrap:wrap; gap:2px; margin:9px 0 5px}
.tk{width:9px; height:15px; border-radius:2px; display:block; padding:0;
  border:1px solid transparent}
button.tk{cursor:pointer}
.tk.R{background:var(--comb-solid)}
.tk.L{background:transparent; border-color:var(--comb-hollow)}
.tk.N{background:var(--comb-unread)}
.spread{display:flex; gap:1px; margin-top:7px}
.spread i{width:6px; height:11px; border-radius:1px; background:var(--line); display:block}
.spread i.on{background:var(--worked)}
.prow .t{font-size:13.5px}
/* A cite on a page that scored below the legibility proxy is drawn dashed, so
   a reader can see the page it points at is one the machine read poorly. */
a.lowcite{border-bottom:1px dashed currentColor; text-decoration:none}
.cop .lgnd{display:flex; gap:13px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-top:4px}
.cop .lgnd span{display:flex; align-items:center; gap:5px}
.covbar .lab{font-size:12px; color:var(--dim); margin-right:2px}
.head{display:flex; align-items:flex-start; gap:8px}
.head .t{flex:1}
.back{
  font:inherit; font-size:13px; background:none; border:none; color:var(--accent);
  padding:0 0 10px; cursor:pointer;
}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px}
.thumb{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:var(--accent-soft); display:block}
.embed{width:100%; aspect-ratio:16/9; border:1px solid var(--line); border-radius:var(--radius); background:#000}
.pagetext{
  white-space:pre-wrap; word-break:break-word; font:13px/1.62 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px; max-height:62vh; overflow:auto;
}
mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
/* A word tesseract was not confident about must never look like one it was. */
.unclear{
  opacity:.45; border-bottom:1px dotted currentColor; cursor:help;
}
.unclear::after{content:""}
/* A redaction is a drawn block on the page. Render it as a block, not as the
   literal word "[REDACTED]" sitting in the sentence like something typed. */
.redblk{
  display:inline-block; vertical-align:baseline; background:currentColor;
  opacity:.82; border-radius:2px; width:5.5em; height:1em; margin:0 .15em;
  position:relative; top:.15em; cursor:help;
}
.conflegend{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin:6px 0 0}
.conflegend span{display:flex; align-items:center; gap:5px}
.legend-dim{opacity:.45; border-bottom:1px dotted currentColor}
.swatch{width:22px; height:9px; border-radius:2px; background:currentColor; display:inline-block}
.src{
  font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--dim);
  font-weight:700; margin:14px 0 5px;
}
.empty{color:var(--dim); font-size:13.5px; padding:22px 4px; text-align:center}
.note{font-size:13px; white-space:pre-wrap; margin-top:7px; color:var(--ink); word-break:break-word}
.count{font-size:12px; color:var(--dim); margin:0 0 10px}
.warnbox{
  border:1px solid var(--warn); color:var(--warn); border-radius:var(--radius);
  padding:10px 12px; font-size:13px; margin-bottom:10px;
}
/* T2.5: the page image beside the transcript. A transcript is a claim about a
   page; this is what makes the claim checkable. Two columns where there is room,
   stacked on a phone. */
.split{display:grid; gap:12px; align-items:start}
@media (min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split > .col-img{position:sticky; top:118px}
}
.pageimg{width:100%; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--panel); display:block}
.imgwrap{position:relative}
.imgbar{display:flex; gap:7px; align-items:center; margin-top:7px; flex-wrap:wrap}
.pagenav{display:flex; gap:7px; align-items:center; margin:10px 0}
.pagenav .sp{flex:1}
ul.cites{list-style:none; margin:8px 0 0; padding:0}
ul.cites li{padding:6px 0; border-top:1px solid var(--line); font-size:13.5px}
ul.cites li a{text-decoration:none}
footer{padding:26px var(--pad) 40px; color:var(--dim); font-size:11.5px; max-width:900px; margin:0 auto; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>PURSUE investigator <span class="sub" id="stamp"></span></h1>
    <button class="act" id="theme" title="Theme">◐</button>
  </div>
  <input type="search" id="q" placeholder="Search documents, media, entities" autocomplete="off" autocapitalize="none" spellcheck="false">
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<footer id="foot"></footer>
<script>
const D = __DATA__;

/* ---------- marks: stars + notes, kept in localStorage ---------- *
 * A mark key must name the thing it marks, never its position in a list.
 * Entity order is by mention count, so it shifts every time mentions are
 * added — a positional key would silently re-point at a different entity
 * and keep looking right, because the stored label would go stale with it.
 * Keys are therefore:
 *   doc:<release_id>            med:<release_id>
 *   page:<release_id>:<n>       ent:<ENTITY_TYPE>:<value_normalized>
 * A key that no longer resolves is shown as unresolved. It is never
 * rebound to whatever now occupies that slot.                              */
const SCHEMA = "pursue.marks/2";
const LS = "pursue.marks.v2", LS_V1 = "pursue.marks.v1";

const kDoc = id => "doc:" + id;
const kMed = id => "med:" + id;
const kPage = (id, pg) => "page:" + id + ":" + pg;
const kEnt = e => "ent:" + e.t + ":" + e.v;

const entIndex = {};
D.ents.forEach((e, i) => { entIndex[e.t + ":" + e.v] = i; });

function parseKey(k){
  const i = k.indexOf(":");
  if (i < 0) return {kind:"?"};
  const kind = k.slice(0, i), rest = k.slice(i + 1);
  if (kind === "page"){ const j = rest.lastIndexOf(":");
    return {kind, id:rest.slice(0, j), pg:+rest.slice(j + 1)}; }
  if (kind === "ent"){ const j = rest.indexOf(":");
    return {kind, t:rest.slice(0, j), v:rest.slice(j + 1)}; }
  return {kind, id:rest};
}
/* Where a mark points today, or null if the corpus no longer has it. */
function resolveKey(k){
  const p = parseKey(k);
  if (p.kind === "doc") return D.docs.some(d => d.id === p.id) ? "doc:" + p.id : null;
  if (p.kind === "med") return D.media.some(m => m.id === p.id) ? "med:" + p.id : null;
  if (p.kind === "page") return (D.pidx[p.id] || []).some(r => r[0] === p.pg)
    ? "page:" + p.id + ":" + p.pg : null;
  if (p.kind === "ent"){ const i = entIndex[p.t + ":" + p.v];
    return i === undefined ? null : "ent:" + i; }
  return null;
}

/* v1 stored entities as ent:<array index>. Map those through the current
   build's ordering. v1 files carry no build stamp, so this assumes they were
   exported against this build — the import path says so out loud. */
function migrateV1(obj){
  const out = {}; let moved = 0, lost = 0;
  for (const [k, v] of Object.entries(obj || {})){
    const pos = /^ent:(\d+)$/.exec(k);
    if (!pos){ out[k] = v; continue; }
    const e = D.ents[+pos[1]];
    if (e){ out[kEnt(e)] = Object.assign({}, v, {label:e.v, vv:e.vv}); moved++; }
    else { out[k] = v; lost++; }
  }
  return {marks:out, moved, lost};
}

let M = {}, migratedNotice = "";
try {
  const raw = localStorage.getItem(LS);
  if (raw) { M = JSON.parse(raw); }
  else {
    const old = localStorage.getItem(LS_V1);
    if (old){
      const r = migrateV1(JSON.parse(old));
      M = r.marks;
      migratedNotice = "Migrated " + Object.keys(M).length + " mark(s) from the old key scheme" +
        (r.moved ? ", rekeying " + r.moved + " entity mark(s) by type and value" : "") +
        (r.lost ? ". " + r.lost + " entity mark(s) pointed at a list position that no longer exists "
                + "and are shown as unresolved" : "") +
        ". The old copy is left untouched under " + LS_V1 + ".";
      localStorage.setItem(LS, JSON.stringify(M));
    }
  }
} catch(e) { M = {}; }

const saveM = () => { try { localStorage.setItem(LS, JSON.stringify(M)); } catch(e) {
  alert("Could not save. Browser storage may be full or blocked in private mode."); } };
const mk = k => M[k] || (M[k] = {star:false, note:"", worked:false, ts:0});
/* isMarked drives the Marks tab, and stays star-or-note on purpose: coverage
 * is a different claim from a mark, and a survey that worked 2,000 pages must
 * not bury the handful of things the reader actually flagged. */
const isMarked = k => !!M[k] && (M[k].star || (M[k].note||"").trim());
const isWorked = k => !!(M[k] && M[k].worked);
/* A record is only discarded when it makes no claim at all. Coverage counts as
 * a claim, so clearing a star no longer throws away that the page was read. */
const isEmpty = m => !m.star && !(m.note||"").trim() && !m.worked;
/* Entity marks carry the verbatim spellings of the group at the time of
   marking. The key is type + normalized value, because that is what defines a
   group; the verbatim list is not identity (a group has several spellings) but
   it is what a future migration would search on if normalization rules change
   the normalized value out from under a key. */
function stamp(k, m){
  const p = parseKey(k);
  if (p.kind === "ent"){
    const i = entIndex[p.t + ":" + p.v];
    if (i !== undefined) m.vv = D.ents[i].vv;
  }
  m.ts = Date.now();
  return m;
}
function toggleStar(k, label){ const m = stamp(k, mk(k)); m.star = !m.star; m.label = label;
  if (isEmpty(m)) delete M[k]; saveM(); render(); }
function setNote(k, v, label){ const m = stamp(k, mk(k)); m.note = v; m.label = label;
  if (isEmpty(m)) delete M[k]; saveM(); }
/* Coverage is stated, never inferred. Opening a page does not mark it worked:
 * the reader says so, because "I looked at this" is a claim about them and the
 * tool has no way to observe it. */
function toggleWorked(k, label){ const m = stamp(k, mk(k)); m.worked = !m.worked; m.label = label;
  if (isEmpty(m)) delete M[k]; saveM(); render(); }

/* ---------- tiny helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rxesc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const dur = s => { s = Math.round(s); const m = Math.floor(s/60); return m ? m+"m "+(s%60)+"s" : s+"s"; };
const mb = b => b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : Math.round(b/1e6)+" MB";
const $ = id => document.getElementById(id);

/* ---------- routing ---------- *
 * Every view is a history entry, so the browser back button walks back through
 * the tool the way it walks back through any site, and the scroll offset of a
 * list is restored when you return to it. Surveying 211 releases means leaving
 * and re-entering the same list hundreds of times, and being dropped at the top
 * of it each time loses your place — which is the one thing a survey cannot
 * afford. The view is also written to the URL, so a document or a single page
 * can be bookmarked, shared, or reopened tomorrow.                            */
let T = "docs", Q = "", SEL = null;
const TABS = [["docs","Documents"],["media","Media"],["ents","Entities"],["marks","Marks"]];
const VIEWS = ["docs","media","ents","marks","page"];

/* Scroll offset waiting to be applied once the view it belongs to has drawn.
 * null means "leave the scroll alone": re-rendering after a star or a note must
 * not move the reader, and only a navigation says where to land. */
let pendingScroll = null;

function stateNow(){ return {T:T, Q:Q, SEL:SEL, COV:COV}; }

function stateToHash(st){
  const p = new URLSearchParams();
  p.set("t", st.T);
  if (st.Q) p.set("q", st.Q);
  if (st.COV && st.COV !== "all") p.set("cov", st.COV);
  const s = st.SEL;
  if (s) {
    if (s.id != null) p.set("id", s.id);
    if (s.pg != null) p.set("pg", s.pg);
    if (s.i  != null) p.set("i",  s.i);
    if (s.hl)         p.set("hl", s.hl);
  }
  return "#" + p.toString();
}

function hashToState(h){
  const p = new URLSearchParams(String(h || "").replace(/^#/, ""));
  const t = p.get("t");
  if (!t || VIEWS.indexOf(t) < 0) return null;
  const cov = p.get("cov");
  const st = {T:t, Q:p.get("q") || "", COV:(COVS.indexOf(cov) > 0 ? cov : "all"), SEL:null};
  const id = p.get("id"), pg = p.get("pg"), i = p.get("i");
  if (t === "page") {
    if (!id || pg == null) return null;
    st.SEL = {id:id, pg:+pg, hl:p.get("hl") || ""};
  } else if (t === "ents" && i != null && i !== "") {
    st.SEL = {i:+i};
  } else if (id && (t === "docs" || t === "media")) {
    st.SEL = {id:id};
  }
  return st;
}

function replaceRoute(scroll){
  const st = stateNow();
  try { history.replaceState({st:st, scroll:scroll}, "", stateToHash(st)); } catch(e){}
}

function go(tab, sel){
  /* Stamp where the view being left was scrolled to onto its own history entry,
   * before pushing the new one. That offset is what popstate restores. */
  try { history.replaceState({st:stateNow(), scroll:window.scrollY}, "", stateToHash(stateNow())); } catch(e){}
  T = tab; SEL = sel || null;
  const st = stateNow();
  try { history.pushState({st:st, scroll:0}, "", stateToHash(st)); } catch(e){}
  pendingScroll = 0;
  render();
}

/* A restore is applied on the frame after the view draws. page view fetches its
 * text before it draws, so it restores late; every other view restores at once.
 * Both funnel through wire(), which every view calls when it is done. */
function applyScroll(){
  if (pendingScroll == null) return;
  const y = pendingScroll;
  pendingScroll = null;
  requestAnimationFrame(() => window.scrollTo(0, y));
}

window.addEventListener("popstate", ev => {
  const st = (ev.state && ev.state.st) || hashToState(location.hash);
  if (!st) return;
  T = st.T; Q = st.Q || ""; SEL = st.SEL || null; COV = st.COV || "all";
  const box = $("q");
  if (box && box.value !== Q) box.value = Q;
  pendingScroll = (ev.state && typeof ev.state.scroll === "number") ? ev.state.scroll : 0;
  render();
});

/* ---------- page text: byte-range fetch against spine/pages.jsonl ---------- *
 * The full text layer is 27 MB. Shipping it inside this file would make the
 * app unusable on a phone, so pages are pulled one at a time using the byte
 * offsets in D.pidx. A fetched record is validated against the release and
 * page that were asked for: a mismatch means the index is stale, and the app
 * says so rather than showing text from the wrong page.                       */
const pcache = {};
const DEC = new TextDecoder();
let fullBuf = null;      // set only if the host ignored Range and sent the whole file
let noRange = false;

async function getPage(rid, pg){
  const key = rid+":"+pg;
  if (pcache[key]) return pcache[key];
  const row = (D.pidx[rid] || []).find(r => r[0] === pg);
  if (!row) return {err:"No page record for "+rid+" p."+pg+" in the index."};
  const [, off, len] = row;

  let bytes;
  if (fullBuf) {
    bytes = new Uint8Array(fullBuf, off, len);
  } else {
    let res;
    try {
      res = await fetch("spine/pages.jsonl", {headers:{Range:"bytes="+off+"-"+(off+len-1)}});
    } catch(e) { return {err:"Could not fetch page text: "+e.message+
        ". Opening this file straight from disk will do that — it needs to be served over http."}; }
    if (!res.ok) return {err:"Fetching spine/pages.jsonl returned HTTP "+res.status+"."};
    const buf = await res.arrayBuffer();
    if (res.status === 206) {
      bytes = new Uint8Array(buf);
    } else {
      // Host ignored the Range header and sent all 27 MB. Keep it and slice
      // locally, so this costs one download instead of one per page.
      fullBuf = buf; noRange = true;
      bytes = new Uint8Array(fullBuf, off, len);
    }
  }

  let rec;
  try { rec = JSON.parse(DEC.decode(bytes)); }
  catch(e) { return {err:"Page record did not parse. The index is stale — re-run scripts/build_investigator.py."}; }
  if (rec.release_id !== rid || rec.pdf_page !== pg) return {err:
    "Index points at "+rec.release_id+" p."+rec.pdf_page+" but "+rid+" p."+pg+" was requested. "+
    "The index is stale — re-run scripts/build_investigator.py."};
  return (pcache[key] = rec);
}

/* ---------- coverage ---------- *
 * What a human has actually worked, as distinct from what the corpus contains
 * and from what a machine can read. Stated by the reader, never inferred from
 * a page being opened: the tool cannot observe reading, so it does not claim
 * to. A release is "worked through" when every one of its pages is worked, or
 * when the reader has marked the release itself assessed — two different
 * claims, kept apart, neither standing in for the other.                     */
const COVS = ["all","none","some","done"];
let COV = "all";

const docPages = id => (D.pidx[id]||[]).map(r => r[0]);

function docCoverage(id){
  const pages = docPages(id);
  let w = 0;
  for (const pg of pages) if (isWorked(kPage(id, pg))) w++;
  return {worked:w, total:pages.length, assessed:isWorked(kDoc(id))};
}
function docState(c){
  if (c.assessed || (c.total > 0 && c.worked === c.total)) return "done";
  return c.worked > 0 ? "some" : "none";
}
function corpusCoverage(){
  let started = 0, done = 0, pw = 0, pt = 0;
  for (const d of D.docs){
    const c = docCoverage(d.id), st = docState(c);
    pw += c.worked; pt += c.total;
    if (st !== "none") started++;
    if (st === "done") done++;
  }
  return {started:started, done:done, pagesWorked:pw, pagesTotal:pt};
}
/* The next release with nothing worked, in list order, wrapping once. Survey
 * work is a sweep, and the question it constantly asks is "what have I not
 * looked at yet". */
function nextUnworked(after){
  const L = D.docs;
  const start = after ? L.findIndex(d => d.id === after) + 1 : 0;
  for (let i = start; i < L.length; i++)
    if (docState(docCoverage(L[i].id)) === "none") return L[i];
  for (let i = 0; i < Math.min(start, L.length); i++)
    if (docState(docCoverage(L[i].id)) === "none") return L[i];
  return null;
}

function workedBtn(k, label, onText, offText){
  const on = isWorked(k);
  return `<button class="wbtn ${on?"on":""}" data-worked="${esc(k)}" data-label="${esc(label)}"

}

        click a page number below to open it. Nothing here is inferred from opening a page —
        this records only what you have said you worked.</div>
      <div class="comb">${pages.map(pg => {
        const k = kPage(id, pg), cls = (isWorked(k)?"worked":"") + (isMarked(k)?" starred":"");
        return `<button data-worked="${esc(k)}" data-label="${esc(id+" p."+pg)}" class="${cls}"

/* ---------- recovered text: fetched per page, rendered honestly ---------- *
 * Word rows live in spine/ocr_recovered.csv and are pulled by byte range, the
 * same way page text is. Nothing about confidence is invented here: if the
 * file is still page-per-row there are no scores, and the panel says so
 * instead of rendering everything as though it were certain.                */
const ocache = {};
let ofullBuf = null;

/* A record is not a line: ocr_text holds multi-line page text, so newlines
   inside quotes belong to the field. Splitting on "\n" would tear records. */
function parseCsv(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

async function getRecovered(rid, pg){
  if (D.ocr_fmt === "none") return null;
  const key = rid + ":" + pg;
  if (ocache[key] !== undefined) return ocache[key];
  const row = (D.oidx[rid] || []).find(r => r[0] === pg);
  if (!row) return (ocache[key] = null);
  const [, off, len, mean, low] = row;

  let bytes;
  if (ofullBuf) bytes = new Uint8Array(ofullBuf, off, len);
  else {
    let res;
    try { res = await fetch("spine/ocr_recovered.csv",
      {headers:{Range:"bytes=" + off + "-" + (off + len - 1)}}); }
    catch(e) { return (ocache[key] = {err:"Could not fetch recovered text: " + e.message}); }
    if (!res.ok) return (ocache[key] = {err:"ocr_recovered.csv returned HTTP " + res.status + "."});
    const buf = await res.arrayBuffer();
    if (res.status === 206) bytes = new Uint8Array(buf);
    else { ofullBuf = buf; bytes = new Uint8Array(ofullBuf, off, len); }
  }

  const cols = parseCsv(D.ocr_hdr)[0];
  const rows = parseCsv(DEC.decode(bytes))
    .filter(f => f.length > 1)
    .map(f => { const o = {}; cols.forEach((c, i) => o[c] = f[i]); return o; });
  const bad = rows.find(r => r.release_id !== rid || +r.pdf_page !== pg);
  if (bad) return (ocache[key] = {err:
    "The recovered-text index points at " + bad.release_id + " p." + bad.pdf_page +
    " but " + rid + " p." + pg + " was requested. Re-run scripts/build_investigator.py."});
  return (ocache[key] = {rows, mean, low, fmt:D.ocr_fmt});
}

function renderRecovered(rec, hl){
  if (rec.err) return `<div class="warnbox">${esc(rec.err)}</div>`;
  const floor = D.conf_floor;
  if (rec.fmt === "page"){
    const txt = (rec.rows[0] || {}).ocr_text || "";
    return `<div class="m">Page-per-row schema: this text was recovered before per-word
      scoring existed, so there are no confidences to show and nothing here is dimmed.
      That is an absence of measurement, not a statement that the words are reliable.</div>
      <div class="pagetext">${highlight(txt, hl)}</div>`;
  }
  let nlow = 0, nred = 0;
  const body = rec.rows.map(r => {
    const w = r.word_verbatim;
    if (w === "[REDACTED]"){ nred++;
      return `<span class="redblk" title="Redaction block detected on the page. What is under it is not in the release."></span>`; }
    const c = parseFloat(r.conf);
    if (isFinite(c) && c < floor){ nlow++;
      return `<span class="unclear" title="confidence ${c} — below the floor of ${floor}, shown as unclear">${
        highlight(w, hl)}</span>`; }
    return highlight(w, hl);
  }).join(" ");
  return `<div class="m">
      <span class="pill">mean confidence ${rec.mean == null ? "n/a" : rec.mean}</span>
      <span class="pill">floor ${floor}</span>
      ${nlow?`<span class="pill warn">${nlow} word(s) below floor</span>`:""}
      ${nred?`<span class="pill warn">${nred} redaction block(s)</span>`:""}</div>
    <div class="conflegend">
      <span><i class="swatch"></i> at or above ${floor}</span>
      <span class="legend-dim">dimmed = below ${floor}, tap for the score</span>
      <span><i class="redblk" style="width:2.2em"></i> redaction block</span>
    </div>
    <div class="pagetext">${body}</div>
    <div class="m">Only words at or above ${floor} are eligible for entity extraction.
      Anything dimmed above is excluded from the entity index by design.</div>`;
}

/* ---------- T2.5 page image ---------- *
 * The URL is expanded from a configured template, never guessed. With no
 * template the panel says no host is configured, which is the truth; it does
 * not render a broken frame that reads as "this page has no image".        */
function pageImageUrl(rid, pg){
  const t = (D.pimg && D.pimg.url_template) || "";
  if (!t) return "";
  // The host keys images by the real filename from the source drop. manifest's
  // source_file is the catalogued name, and for 90 of 211 releases the two
  // differ (spaces and underscores flattened to hyphens). pimg.folders carries
  // the resolved host folder; the manifest value is only a fallback.
  const doc = D.docs.find(x => x.id === rid);
  const fold = (D.pimg && D.pimg.folders) || null;
  const sf  = (fold && fold[rid]) || (doc && doc.sf) || "";
  if (!sf) return "";
  return t.replace(/\{source_file\}/g, encodeURIComponent(sf))
          .replace(/\{release_id\}/g, encodeURIComponent(rid))
          .replace(/\{page04\}/g, String(pg).padStart(4, "0"))
          .replace(/\{page\}/g, String(pg));
}

function pageImagePanel(rid, pg){
  const url = pageImageUrl(rid, pg);
  if (!url) return `<div class="src">Page image</div>
    <div class="card"><div class="m">No page-image host is configured, so the scan of this
      page cannot be shown and the transcript below cannot be checked against it.
      <b>The 211 source PDFs are still inside the Drive zips.</b> Render them with
      <code>scripts/render_page_images.py</code>, host the output, then set
      <code>url_template</code> in <code>site/page_images.json</code> and rebuild.</div></div>`;
  return `<div class="src">Page image — ${esc(rid)} p.${pg}</div>
    <div class="imgwrap">
      <img class="pageimg" loading="lazy" src="${esc(url)}" alt="Scan of ${esc(rid)} page ${pg}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="warnbox" style="display:none">No image at the configured location for this
        page. The template resolves to a URL that returned nothing, which says the image is
        missing from the host — not that the page is blank.</div>
    </div>
    <div class="imgbar">
      <a class="act" href="${esc(url)}" target="_blank" rel="noopener">Open full size</a>
    </div>`;
}

function highlight(text, hl){
  const safe = esc(text);
  if (!hl) return safe;
  try { return safe.replace(new RegExp(rxesc(esc(hl)), "gi"), m => "<mark>"+m+"</mark>"); }
  catch(e) { return safe; }
}

      ${m.st!=="INDEXED" ? `<div class="m" style="margin-top:7px">In the Drive folder with no row in
        <b>media.csv</b>. No duration, resolution or hash has been measured, so nothing is claimed
        about it beyond the file existing.</div>` : ""}
      <div class="rowbtns">
        <a class="act primary" href="${esc(m.v)}" target="_blank" rel="noopener">Open in Drive</a>
        <a class="act" href="${esc(m.dl)}" target="_blank" rel="noopener">Download</a>
      </div>
      <div class="m" style="margin-top:9px">Working link only. Drive is access, not provenance:
        no <b>source_url</b> (war.gov) or <b>mirror_url</b> (archive.org) is recorded yet, so nothing
        here is citable.</div>
      ${noteBox(k, m.id)}
    </div>
    <iframe class="embed" src="${esc(m.e)}" allow="autoplay" referrerpolicy="no-referrer"></iframe>
    ${m.th?`<div class="src">Triage strip</div><img class="thumb" style="aspect-ratio:auto"
      src="spine/${esc(m.th)}" alt="Contact sheet for ${esc(m.id)}">`:""}`;
}

/* ---------- T10 co-presence — Layer 5, derived at query time ---------- *
 * CLAUDE.md says Layer 5 relations are never stored, which makes this a
 * rendering problem rather than a pipeline one. Nothing here is written
 * anywhere; every number is recomputed from the payload on each render.
 *
 * The claim is co-presence on a cited page and nothing stronger. No copy in
 * this panel says two things are related, linked or connected, and none of it
 * calls the result a network. The data cannot support those words and the
 * wording is the guardrail, not a style preference.                          */

let PAIRQ = "", CLUSTERED = false;

/* "rid:pg" -> Set(entity index). Built once from ents[].c rather than shipped:
 * the spec budgeted 213.5 KB for this map, and the payload already carries the
 * same relation as cites. One pass over ~11,000 strings costs milliseconds. */
let PE = null;
function pageEnts(){
  if (PE) return PE;
  PE = new Map();
  D.ents.forEach(e => {
    for (const c of e.c){
      let a = PE.get(c);
      if (!a) PE.set(c, a = new Set());
      a.add(e.i);
    }
  });
  return PE;
}
/* A release_id can contain a colon in principle, so split from the right. */
const citeRid = c => c.slice(0, c.lastIndexOf(":"));
const citePg  = c => +c.slice(c.lastIndexOf(":") + 1);

/* Per-release readability, expanded from the run-string the build emits. */
const PST = {};
function stateMap(rid){
  if (PST[rid]) return PST[rid];
  const doc = D.docs.find(d => d.id === rid), rows = D.pidx[rid] || [], st = [];
  for (const part of ((doc && doc.read) || "").split(",")){
    if (!part) continue;
    const n = +part.slice(1);
    for (let i = 0; i < n; i++) st.push(part[0]);
  }
  const m = new Map();
  rows.forEach((r, j) => m.set(r[0], st[j] || "R"));
  return (PST[rid] = m);
}
const pgState = (rid, pg) => stateMap(rid).get(pg) || "R";

/* Scope is every page of every release where the subject appears, unreadable
 * pages included. That is the set where a co-mention could have existed: on a
 * page nobody could read, this subject may well sit beside something else and
 * there is no way to know. Reporting coverage against the readable subset
 * alone would quietly shrink the denominator. */
function subjectScope(e){
  const seen = new Set(), docs = [];
  for (const c of e.c){
    const r = citeRid(c);
    if (!seen.has(r)){ seen.add(r); docs.push(r); }
  }
  docs.sort();
  const pages = [];
  for (const rid of docs) for (const row of (D.pidx[rid] || [])) pages.push([rid, row[0]]);
  return {docs, pages};
}
function scopeCounts(pages){
  const c = {R:0, L:0, N:0};
  for (const [rid, pg] of pages) c[pgState(rid, pg)]++;
  return c;
}

/* The comb never hides. On a narrow screen it subsamples harder; it is not
 * behind a collapse control, not behind a media query, and not dropped at any
 * width. Where it subsamples it says so and states the stride. */
function machineComb(pages){
  const max = window.innerWidth < 560 ? 260 : 520;
  const stride = Math.max(1, Math.ceil(pages.length / max));
  const shown = [];
  for (let i = 0; i < pages.length; i += stride) shown.push(pages[i]);
  const label = {R:"text layer", L:"below the page-legibility proxy", N:"could not be read"};
  const html = shown.map(([rid, pg]) => {
    const st = pgState(rid, pg);
    const ttl = esc(rid) + " p." + pg + " — " + label[st];
    /* Subsampled ticks stand for several pages, so they do not pretend to be a
       link to one of them. */
    return stride === 1
      ? `<button class="tk ${st}" data-go="page:${esc(rid)}:${pg}" title="${ttl}"></button>`
      : `<span class="tk ${st}" title="${ttl}"></span>`;
  }).join("");
  return {stride, shown: shown.length, html: `<div class="mcomb">${html}</div>`};
}

const entLabel = r => r.cl ? r.cl : (D.ents[r.i] ? D.ents[r.i].v : "?");
const isCand = e => e && e.f && e.f !== "CLEAN";

function clusterRows(rows){
  const loose = [], byCl = new Map();
  for (const r of rows){
    const e = D.ents[r.i], cl = e && e.cl;
    if (!cl){ loose.push(r); continue; }
    let g = byCl.get(cl);
    if (!g) byCl.set(cl, g = {cl, i: r.i, members: [], docs: new Set(), cites: []});
    g.members.push(r.i);
    r.docs.forEach(d => g.docs.add(d));
    g.cites.push.apply(g.cites, r.cites);
  }
  return loose.concat(Array.from(byCl.values()));
}

/* Sorted by release count first and page count second, never by raw mention
 * count: twelve mentions inside one release is a different observation from
 * twelve across nine, and sorting on the total would hide that. */
function partnersOf(e){
  const pe = pageEnts(), by = new Map();
  for (const c of new Set(e.c)){
    const set = pe.get(c);
    if (!set) continue;
    const rid = citeRid(c);
    for (const oi of set){
      if (oi === e.i) continue;
      let r = by.get(oi);
      if (!r) by.set(oi, r = {i: oi, docs: new Set(), cites: []});
      r.docs.add(rid); r.cites.push(c);
    }
  }
  let rows = Array.from(by.values());
  if (CLUSTERED) rows = clusterRows(rows);
  rows.sort((a, b) => b.docs.size - a.docs.size
    || b.cites.length - a.cites.length
    || entLabel(a).localeCompare(entLabel(b)));
  return rows;
}

/* One tick per release in scope, filled where the partner is also present. Two
 * partners with the same page count but different spread do not look alike. */
function spreadBar(r, scopeDocs){
  const stride = Math.max(1, Math.ceil(scopeDocs.length / 60));
  let html = "";
  for (let i = 0; i < scopeDocs.length; i += stride)
    html += `<i class="${r.docs.has(scopeDocs[i]) ? "on" : ""}"></i>`;
  return `<div class="spread" title="${r.docs.size} of ${scopeDocs.length} releases in scope${
    stride > 1 ? ", one tick per " + stride + " releases" : ""}">${html}</div>`;
}

function citeList(cites, hlv){
  return `<ul class="cites">${cites.slice(0, 60).map(c => {
    const rid = citeRid(c), pg = citePg(c), low = pgState(rid, pg) === "L";
    return `<li><a href="#" class="${low ? "lowcite" : ""}" data-go="page:${esc(rid)}:${pg}"${
      hlv ? ` data-hl="${esc(hlv)}"` : ""} title="${low
        ? "this page scored below the page-legibility proxy" : ""}">${esc(rid)} · p.${pg}</a></li>`;
  }).join("")}</ul>${cites.length > 60
    ? `<div class="m">Showing 60 of ${cites.length} cites.</div>` : ""}`;
}

/* Three outcomes, never two. "Not in the index" is a fact about the index and
 * is reported as one; it is not evidence about the corpus. A string matching
 * several groups is reported ambiguous with the candidates, never resolved. */
function pairResult(e, str){
  const q = String(str || "").trim();
  if (!q) return "";
  const ql = q.toLowerCase();
  const exact = D.ents.filter(x => x.v.toLowerCase() === ql
    || x.vv.some(v => v.toLowerCase() === ql));
  if (!exact.length){
    const loose = D.ents.filter(x => x.v.toLowerCase().includes(ql)
      || x.vv.some(v => v.toLowerCase().includes(ql))).slice(0, 6);
    return `<div class="warnbox"><b>“${esc(q)}” is not in the index.</b> That is a miss in
      the entity index, which is a regex pass over readable text — not a finding about the
      corpus. The string may well be on a page that carries no text layer.</div>` +
      (loose.length ? `<div class="m">Close surface forms that are indexed:
        ${loose.map(x => `<button class="act" data-go="ent:${x.i}">${esc(x.v)}</button>`).join(" ")}</div>` : "");
  }
  if (exact.length > 1){
    return `<div class="warnbox"><b>“${esc(q)}” matches ${exact.length} groups.</b>
      Reported as ambiguous rather than resolved to one of them.</div>
      <div class="m">${exact.map(x => `<button class="act" data-go="ent:${x.i}">${esc(x.v)}
        <span class="pill">${esc(x.t)}</span></button>`).join(" ")}</div>`;
  }
  const other = exact[0];
  if (other.i === e.i)
    return `<div class="m">That is the subject itself.</div>`;
  const mine = new Set(e.c);
  const shared = Array.from(new Set(other.c.filter(c => mine.has(c))));
  const {pages} = subjectScope(e);
  const unread = scopeCounts(pages).N;
  if (shared.length){
    const docs = new Set(shared.map(citeRid));
    return `<div class="card"><div class="t">Co-present</div>
      <div class="m"><b>${esc(e.v)}</b> and <b>${esc(other.v)}</b> appear on the same page in
        ${docs.size} release${docs.size > 1 ? "s" : ""}, ${shared.length}
        page${shared.length > 1 ? "s" : ""}.
        ${isCand(other) ? `<span class="pill warn">${esc(other.f)}</span>` : ""}</div>
      ${citeList(shared, other.vv[0])}</div>`;
  }
  return `<div class="card"><div class="t">Not observed</div>
    <div class="m"><b>${esc(other.v)}</b> was not extracted from any page where
      <b>${esc(e.v)}</b> was. Within this subject's scope, <b>${unread}</b>
      page${unread === 1 ? "" : "s"} carry no text layer and were never read, so this is a
      statement about what the index holds and not about what the pages contain.</div></div>`;
}

function copresencePanel(e){
  const {docs, pages} = subjectScope(e);
  const cnt = scopeCounts(pages);
  const comb = machineComb(pages);
  const rows = partnersOf(e);
  const nMedia = D.media.length;

  const head = `<div class="src">Co-presence — what else sits on these pages</div>
    <div class="card cop">
      <div class="m">Scope is every page of the ${docs.length}
        release${docs.length === 1 ? "" : "s"} where <b>${esc(e.v)}</b> appears
        — ${pages.length} pages, unreadable ones included, because that is the set where a
        co-mention could have existed.</div>
      ${comb.html}
      <div class="lgnd">
        <span><i class="tk R"></i>${cnt.R} text layer</span>
        <span><i class="tk L"></i>${cnt.L} below the page-legibility proxy</span>
        <span><i class="tk N"></i>${cnt.N} could not be read</span>
      </div>
      <div class="m">${comb.stride > 1
        ? `Subsampled at a fixed stride of ${comb.stride}: ${comb.shown} ticks for
           ${pages.length} pages. Counts above are over all ${pages.length}, not the sample.`
        : `One tick per page. Click a tick to open that page.`}</div>
      <div class="m" style="margin-top:9px">${nMedia} media files are not searched here.
        A segment can carry a cite by timestamp, but segment confidence is not scored, so a
        segment would enter with no denominator while every page above has one. Leaving them
        out silently would break the same rule this comb exists to enforce.</div>
    </div>`;

  const toggle = `<div class="covbar">
      <button class="wbtn ${CLUSTERED ? "on" : ""}" data-clust="1">${CLUSTERED
        ? "✓ grouping unreviewed alias clusters" : "group unreviewed alias clusters"}</button>
      <span class="lab">${Object.keys(D.clusters || {}).length} clusters, none reviewed</span>
    </div>`;

  const body = rows.length
    ? `<div class="src">Co-present with (${rows.length})</div>` + toggle + rows.map(r => {
        const oe = D.ents[r.i];
        const nm = entLabel(r);
        const pages_ = new Set(r.cites).size;
        return `<div class="card tap prow" ${r.cl ? "" : `data-go="ent:${r.i}"`}>
          <div class="head"><div class="t">${esc(nm)}</div></div>
          <div class="m">
            <span class="pill">${r.docs.size} release${r.docs.size === 1 ? "" : "s"}</span>
            <span class="pill">${pages_} page${pages_ === 1 ? "" : "s"}</span>
            ${r.cl ? `<span class="pill warn">unreviewed cluster of ${r.members.length}</span>`
                   : `<span class="pill">${esc(oe.t)}</span>`}
            ${!r.cl && isCand(oe) ? `<span class="pill warn">${esc(oe.f)}</span>` : ""}
          </div>
          ${spreadBar(r, docs)}
        </div>`;
      }).join("")
    : `<div class="src">Co-present with (0)</div>` + toggle +
      `<div class="warnbox">No other extracted entity appears on any page where
        <b>${esc(e.v)}</b> appears. Of the ${pages.length} pages in scope, <b>${cnt.N}</b>
        carry no text layer and <b>${cnt.L}</b> scored below the page-legibility proxy, so
        ${cnt.N + cnt.L} of them were never fully read. This is a statement about what the
        index holds, not about what the pages contain.</div>`;

  const pair = `<div class="src">Pair test</div>
    <div class="card">
      <div class="m">Ask whether one other surface form sits on a page with this subject.
        Three outcomes: co-present with cites, not observed with the unread count, or not in
        the index at all.</div>
      <div class="covbar">
        <input type="text" id="pairq" placeholder="a name or organisation as it appears"
          value="${esc(PAIRQ)}" style="flex:1; min-width:170px">
        <button class="act primary" data-pair="1">Test</button>
        ${PAIRQ ? `<button class="act" data-pair="">Clear</button>` : ""}
      </div>
      ${pairResult(e, PAIRQ)}
    </div>`;

  return head + body + pair;
}

function entsView(){
  const q = Q.toLowerCase();
  const rows = (q ? D.ents.filter(e =>
      e.v.toLowerCase().includes(q) || e.vv.some(v => v.toLowerCase().includes(q)))
    : D.ents).slice(0, 400);
  return `<p class="count">${D.ents.length} entity groups from ${D.etotal} mentions.
    Regex candidates, not a verified roster.</p>` + (rows.length ? rows.map((e, i) => `
    <div class="card tap" data-go="ent:${e.i}">
      <div class="head"><div class="t">${esc(e.v)}</div>${starBtn(kEnt(e), e.v)}</div>
      <div class="m"><span class="pill">${esc(e.t)}</span>
        <span class="pill">${e.n} mention${e.n>1?"s":""}</span>
        ${e.f!=="CLEAN"?`<span class="pill warn">${esc(e.f)}</span>`:""}
        ${e.vv.length>1?`<span class="pill">${e.vv.length} spellings</span>`:""}</div>
    </div>`).join("") + (!q && D.ents.length > 400
      ? `<p class="empty">Showing the 400 most-mentioned. Search to reach the rest.</p>` : "")
    : `<p class="empty">Nothing matches “${esc(Q)}”.</p>`);
}

function entView(i){
  const e = D.ents[i];
  if (!e) return `<p class="empty">Unknown entity.</p>`;
  const k = kEnt(e);
  return `<button class="back" data-go="ents">← Entities</button>
    <div class="card">
      <div class="head"><div class="t">${esc(e.v)}</div>${starBtn(k, e.v)}</div>
      <div class="m"><span class="pill">${esc(e.t)}</span>
        <span class="pill">${e.n} mentions</span>
        ${e.f!=="CLEAN"?`<span class="pill warn">${esc(e.f)}</span>`:""}</div>
      ${e.vv.length>1?`<div class="m" style="margin-top:7px">Verbatim spellings:
        ${e.vv.map(v=>`<span class="pill">${esc(v)}</span>`).join("")}</div>`:""}
      <div class="m" style="margin-top:9px">A row here is a pattern match on a page, not a verified
        identification. Open the cite and read the page.</div>
      ${noteBox(k, e.v)}
    </div>
    ${copresencePanel(e)}
    <div class="src">Cites (${e.c.length})</div>
    <div class="card">${citeList(e.c, e.vv[0])}</div>`;
}

function marksView(){
  const keys = Object.keys(M).filter(k => isMarked(k))
    .sort((a,b) => (M[b].ts||0) - (M[a].ts||0));
  let unresolved = 0;
  const body = keys.length ? keys.map(k => {
    const m = M[k], p = parseKey(k), target = resolveKey(k);
    if (!target) unresolved++;
    const title = esc(m.label || k);
    return `<div class="card">
      <div class="head">
        <div class="t" style="font-size:13.5px">${target
          ? `<a href="#" data-go="${esc(target)}">${title}</a>`
          : title}</div>
        ${starBtn(k, m.label||k)}
      </div>
      <div class="m"><span class="pill">${esc(p.kind)}</span>
        ${p.kind==="ent"?`<span class="pill">${esc(p.t)}</span>`:""}
        <span class="pill">${new Date(m.ts||0).toISOString().slice(0,10)}</span>
        ${target?"":`<span class="pill warn">unresolved</span>`}</div>
      ${target?"":`<div class="m">Nothing in this build answers to <code>${esc(k)}</code>.
        The mark is kept as written and is not re-pointed at anything else.</div>`}
      ${(m.note||"").trim()?`<div class="note">${esc(m.note)}</div>`:""}
    </div>`;
  }).join("") : `<p class="empty">Nothing marked yet. Star anything, or leave a note on it.</p>`;
  const b = D.build || {};
  return (migratedNotice ? `<div class="warnbox">${esc(migratedNotice)}</div>` : "") +
    `<p class="count">${keys.length} marked${unresolved?`, ${unresolved} unresolved`:""}.
      Stored in this browser only — export before clearing site data or switching devices.<br>
      Corpus build <b>${esc(b.commit||"unknown")}</b>${b.dirty?" (uncommitted changes)":""},
      built ${esc(b.built||"?")}. Exports carry this stamp so a later import can tell whether the
      corpus moved underneath the notes.</p>
    <div class="card"><div class="rowbtns">
      <button class="act primary" id="exp">Export JSON</button>
      <button class="act" id="imp">Import JSON</button>
      <button class="act" id="clr">Clear all</button>
    </div></div>` + body;
}

/* ---------- render + events ---------- */
function render(){
  $("tabs").innerHTML = TABS.map(([k, lab]) =>
    `<button data-tab="${k}" aria-selected="${T===k}">${lab}</button>`).join("");
  const v = $("view");
  v.parentElement.classList.toggle("wide", T === "page");
  if (T === "docs")  v.innerHTML = SEL ? docView(SEL.id) : docsView();
  else if (T === "media") v.innerHTML = SEL ? medView(SEL.id) : mediaView();
  else if (T === "ents")  v.innerHTML = SEL ? entView(SEL.i) : entsView();
  else if (T === "marks") v.innerHTML = marksView();
  else if (T === "page")  { pageView(SEL.id, SEL.pg); return; }
  wire();
}

function wire(){
  document.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = ev => {
      ev.preventDefault(); ev.stopPropagation();
      const [kind, a, b] = el.dataset.go.split(":");
      const hl = el.dataset.hl || "";
      if (kind === "doc")  go("docs", {id:a});
      else if (kind === "docs")  go("docs");
      else if (kind === "media") go("media");
      else if (kind === "ents")  go("ents");
      else if (kind === "med")   go("media", {id:a});
      else if (kind === "ent")   go("ents", {i:+a});
      else if (kind === "page")  go("page", {id:a, pg:+b, hl});
    };
  });
  document.querySelectorAll("[data-worked]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      toggleWorked(el.dataset.worked, el.dataset.label); };
  });
  document.querySelectorAll("[data-pair]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      const box = $("pairq");
      PAIRQ = el.dataset.pair ? (box ? box.value : "") : "";
      render(); };
  });
  if ($("pairq")) $("pairq").onkeydown = ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); PAIRQ = ev.target.value; render(); }
  };
  document.querySelectorAll("[data-clust]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      CLUSTERED = !CLUSTERED; render(); };
  });
  document.querySelectorAll("[data-cov]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      COV = COVS.indexOf(el.dataset.cov) < 0 ? "all" : el.dataset.cov;
      replaceRoute(0); render(); };
  });
  document.querySelectorAll("[data-next]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      go("docs", {id: el.dataset.next}); };
  });
  document.querySelectorAll("[data-star]").forEach(el => {
    el.onclick = ev => { ev.preventDefault(); ev.stopPropagation();
      toggleStar(el.dataset.star, el.dataset.label); };
  });
  document.querySelectorAll("[data-note]").forEach(el => {
    el.onclick = ev => ev.stopPropagation();
    el.oninput = () => setNote(el.dataset.note, el.value, el.dataset.label);
  });
  if ($("exp")) $("exp").onclick = () => {
    const payload = {
      schema: SCHEMA,
      exported_utc: new Date().toISOString(),
      corpus_build: D.build || null,
      marks: M
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pursue-marks-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };
  if ($("imp")) $("imp").onclick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json";
    inp.onchange = async () => {
      let obj;
      try { obj = JSON.parse(await inp.files[0].text()); }
      catch(e) { alert("Could not read that file: " + e.message); return; }

      const notes = [];
      let incoming;
      if (obj && obj.schema === SCHEMA && obj.marks) {
        incoming = obj.marks;
      } else if (obj && obj.schema && obj.marks) {
        // A newer or unknown schema. Take the marks, say plainly that the
        // rest of the file was not understood, rather than pretending.
        incoming = obj.marks;
        notes.push("File declares schema " + obj.schema + ", this build reads " + SCHEMA +
          ". The marks were loaded; anything else in the file was ignored.");
      } else if (obj && !obj.schema && typeof obj === "object") {
        const r = migrateV1(obj);
        incoming = r.marks;
        notes.push("No schema or build stamp, so this is an old export. " +
          (r.moved ? r.moved + " entity mark(s) were stored by list position and have been " +
            "rekeyed by type and value, assuming the file came from this build. Check them. " : "") +
          (r.lost ? r.lost + " pointed at a position that no longer exists. " : ""));
      } else { alert("That file is not a marks export."); return; }

      const ib = obj.corpus_build, cb = D.build || {};
      if (ib && ib.commit && cb.commit && ib.commit !== cb.commit)
        notes.push("Exported against corpus build " + ib.commit + "; this build is " + cb.commit +
          ". The corpus moved — check anything that now shows as unresolved.");

      let n = 0, skipped = 0;
      for (const [k, v] of Object.entries(incoming)) {
        const cur = M[k];
        if (!cur || (v.ts||0) > (cur.ts||0)) { M[k] = v; n++; } else skipped++;
      }
      saveM(); render();
      const stale = Object.keys(incoming).filter(k => !resolveKey(k)).length;
      alert("Merged " + n + " mark(s)" + (skipped ? ", kept " + skipped + " newer local copy(s)" : "") +
        ". Nothing was deleted." + (stale ? "\n\n" + stale + " do not resolve in this build and are " +
        "listed as unresolved." : "") + (notes.length ? "\n\n" + notes.join("\n\n") : ""));
    };
    inp.click();
  };
  if ($("clr")) $("clr").onclick = () => {
    if (confirm("Delete every star and note in this browser? Export first if you want them.")) {
      M = {}; migratedNotice = ""; saveM(); render();
    }
  };
  /* T10 criterion 10: a co-presence panel without its comb is unproducible.
     A zero result and its denominator ship together or the panel is replaced by
     a failure notice — an absence claim with no coverage behind it is exactly
     the thing this tool exists not to make. */
  if (T === "ents" && SEL){
    const cop = document.querySelector(".cop");
    if (cop && !cop.querySelector(".mcomb")){
      cop.innerHTML = `<div class="warnbox">This panel rendered without its coverage comb,
        so the co-presence counts below have no denominator and must not be read. This is a
        build fault, not a finding.</div>`;
    }
  }
  applyScroll();
}

$("tabs").onclick = ev => { const b = ev.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
$("q").oninput = ev => { Q = ev.target.value.trim(); SEL = null;
  if (T === "page" || T === "marks") T = "docs";
  /* Replace rather than push: a query is edited keystroke by keystroke and
   * every one of them would otherwise become a history entry to walk back. */
  replaceRoute(0);
  render(); };
$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
};

$("stamp").textContent = D.built;
$("foot").innerHTML = `Built from the spine at ${esc(D.built)}: ${D.docs.length} documents,
  ${D.npages} pages, ${D.media.length} media files, ${D.etotal} entity mentions.
  Page text is fetched from <code>spine/pages.jsonl</code> as needed.<br><br>
  This is the working tool, not the public record. Media links point at one private Drive
  account and are access only. Entity rows are regex candidates. Contradictions in the corpus
  are kept side by side and are not resolved here.`;
/* The browser restores its own scroll position on a back navigation, which
 * fights the offset recorded per entry. Ours is the one that knows which view
 * is being restored, so the browser's is turned off. */
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}

(function adoptRoute(){
  const st = hashToState(location.hash);
  if (st) {
    T = st.T; Q = st.Q || ""; SEL = st.SEL || null; COV = st.COV || "all";
    const box = $("q");
    if (box) box.value = Q;
  }
  replaceRoute(0);
})();

render();
</script>
</body>
</html>
